[package]
name = "company-agent"
version = "0.1.0"
edition = "2024"
default-run = "company-agent"

[[bin]]
name = "company-agent"
path = "src/main.rs"

[[bin]]
name = "agent-updater"
path = "src/updater.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures-util = "0.3"
keyring = { version = "3.6", features = ["windows-native"] }
rand = "0.8"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = "0.26"
url = "2.5"
uuid = { version = "1.12", features = ["v4", "serde"] }

[project]
name = "company-agent-api"
version = "0.1.0"
description = "FastAPI control plane for the Codex + DeepSeek migration"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "sse-starlette>=2.2,<3",
  "uvicorn[standard]>=0.34,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires explicitly supplied disposable external infrastructure"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# FastAPI intentionally declares dependency providers in signature defaults.
ignore = ["B008"]
